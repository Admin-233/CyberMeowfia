name: Android NDK Build All Targets

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:


jobs:
  build:

    name: Build all Android targets
    runs-on: ubuntu-latest

    env:
      API: 35
      EXPLOIT_DIR: IonStack/CVE-2026-43499/exploit
      NDK_VERSION: 29.0.13113456


    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk
          key: android-ndk-${{ env.NDK_VERSION }}


      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"


      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> $GITHUB_ENV


      - name: List targets
        working-directory: ${{ env.EXPLOIT_DIR }}
        run: |

          find src/targets \
            -mindepth 2 \
            -maxdepth 2 \
            -name target.h \
            -printf '%h\n' \
            | sed 's#src/targets/##' \
            | sort \
            > targets.txt


          echo "Detected targets:"
          cat targets.txt


      - name: Build all targets
        working-directory: ${{ env.EXPLOIT_DIR }}
        run: |

          rm -rf build


          while read PROJECT
          do

            echo
            echo "======================================"
            echo " Building: ${PROJECT}"
            echo "======================================"

            make \
              API=${API} \
              PROJECT=${PROJECT}


          done < targets.txt



      - name: Verify all outputs
        working-directory: ${{ env.EXPLOIT_DIR }}
        run: |

          echo "Generated files:"

          find build \
            -name preload.so \
            -exec file {} \;


          echo
          echo "SHA256:"

          find build \
            -name preload.so \
            -exec sha256sum {} \;



      - name: Upload all builds
        uses: actions/upload-artifact@v4
        with:

          name: android-all-targets

          path: |
            IonStack/CVE-2026-43499/exploit/build/
